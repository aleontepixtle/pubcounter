services:
  # Redis - Job queue backend
  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - inventory-network

  # Flask Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: inventory-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - REDIS_URL=redis://redis:6379/0
      - EVENTLET_NO_GREENDNS=true
      - AUTOMATION_SCRIPT_PATH=/automation
      - AUTOMATION_SCRIPT_HOST_PATH=${AUTOMATION_SCRIPT_HOST_PATH:-/home/a-robut/Documents/Github/pubcounter/src/utilities/selenium-inventory-submit}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - ./static:/app/static
      - ./instance:/app/instance
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker
      - ${AUTOMATION_SCRIPT_PATH:-../src/utilities/selenium-inventory-submit}:/automation:ro
    depends_on:
      - redis
    networks:
      - inventory-network
    command: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:5000 run:app

  # RQ Worker - Processes automation jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: inventory-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EVENTLET_NO_GREENDNS=true
      - AUTOMATION_SCRIPT_PATH=/automation
      - AUTOMATION_SCRIPT_HOST_PATH=${AUTOMATION_SCRIPT_HOST_PATH:-/home/a-robut/Documents/Github/pubcounter/src/utilities/selenium-inventory-submit}
    volumes:
      - ./app:/app/app
      - ./instance:/app/instance
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker
      - ${AUTOMATION_SCRIPT_PATH:-../src/utilities/selenium-inventory-submit}:/automation:ro
      - /tmp:/tmp  # For temporary env files
    depends_on:
      - redis
    networks:
      - inventory-network
    command: python -m app.worker

volumes:
  redis_data:

networks:
  inventory-network:
    driver: bridge